# /etc/tmpfiles.d/secwatch.conf - setgid state dir so root-written files stay group secwatch
d /var/lib/secwatch          2770 secwatch secwatch - -
d /var/lib/secwatch/reports  2770 secwatch secwatch - -
d /var/lib/secwatch/cache    2770 secwatch secwatch - -
d /var/lib/secwatch/secrets  2770 secwatch secwatch - -
